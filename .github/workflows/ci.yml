name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'copilot/**'

jobs:
  test-and-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax checks
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Dependency audit
        run: npm audit --audit-level=high
