<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EH Graced Roads - Fleet Account Registration Portal</title>
    <style>
        body { background-color: #020617; color: #f1f5f9; font-family: sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; margin: 0; box-sizing: border-box; }
        .intake-card { width: 100%; max-width: 520px; background-color: #0f172a; border: 1px solid #38bdf8; border-radius: 16px; padding: 24px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); }
        h2 { text-align: center; color: #38bdf8; margin-top: 0; text-transform: uppercase; font-size: 18px; font-weight: 900; border-bottom: 1px solid #1e293b; padding-bottom: 12px; }
        .banner-disclosure { background-color: rgba(56, 189, 248, 0.05); border: 1px dashed #38bdf8; border-radius: 8px; padding: 10px; font-size: 11px; color: #cbd5e1; line-height: 1.4; margin-bottom: 16px; text-align: justify; }
        label { font-size: 11px; color: #38bdf8; font-weight: bold; text-transform: uppercase; display: block; margin-bottom: 6px; margin-top: 10px; }
        input[type="text"], input[type="email"], select { width: 100%; padding: 10px; background-color: #1e293b; border: 1px solid #334155; color: white; border-radius: 8px; font-size: 13px; outline: none; box-sizing: border-box; margin-bottom: 12px; }
        .submit-btn { background-color: #38bdf8; color: #020617; font-weight: 900; text-transform: uppercase; padding: 14px; width: 100%; border: none; border-radius: 8px; cursor: pointer; font-size: 13px; margin-top: 10px; }
        .status-banner { border: 1px solid #334155; text-align: center; font-weight: bold; padding: 12px; border-radius: 8px; font-size: 12px; display: none; text-transform: uppercase; margin-top: 14px; }
        .status-ok { background-color: rgba(16, 185, 129, 0.1); border-color: #10b981; color: #10b981; }
        .status-error { background-color: rgba(239, 68, 68, 0.1); border-color: #ef4444; color: #ef4444; }
    </style>
</head>
<body>
    <div class="intake-card">
        <h2>Carrier Fleet Account Intake</h2>
        <div class="banner-disclosure">
            <strong>OPERATIONS NOTE:</strong> This prototype stores requests in local backup files. No regulated billing, payments, or tax workflows are active. Use masked references only (never full EIN/account numbers).
        </div>
        <form id="intake-form">
            <label>Carrier Transport Company Name</label>
            <input type="text" id="i-carrier" placeholder="e.g., Werner Enterprises, Knight-Swift" required>

            <label>Tax Reference (Optional Masked Last 4)</label>
            <input type="text" id="i-tax-ref" placeholder="e.g., XX1234">

            <label>Accounts Payable Billing Email</label>
            <input type="email" id="i-email" placeholder="ap@transportfirm.com" required>

            <label>Requested Account Payment Cycle Terms</label>
            <select id="i-terms" required>
                <option value="">-- Choose terms --</option>
                <option value="Net 30">Net 30 Standard Commercial Open Account</option>
                <option value="Net 60">Net 60 Extended Corporate Credit Line</option>
                <option value="Card on File">On-Scene Card Processing (Demo Workflow)</option>
            </select>

            <div id="intake-status-box" class="status-banner"></div>
            <button type="submit" id="i-btn" class="submit-btn">Submit Intake Request</button>
        </form>
    </div>
    <script>
        const form = document.getElementById('intake-form');
        const statusBox = document.getElementById('intake-status-box');
        const submitBtn = document.getElementById('i-btn');

        function setStatus(message, ok) {
            statusBox.textContent = message;
            statusBox.className = `status-banner ${ok ? 'status-ok' : 'status-error'}`;
            statusBox.style.display = 'block';
        }

        function operatorHeaders() {
            const token = window.localStorage.getItem('operatorToken') || '';
            return token ? { 'x-operator-token': token } : {};
        }

        async function safeParseResponse(response) {
            const text = await response.text();
            if (!text) return {};
            try {
                return JSON.parse(text);
            } catch (_error) {
                return { raw: text };
            }
        }

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            submitBtn.disabled = true;
            submitBtn.textContent = 'Submitting...';
            setStatus('Submitting onboarding request...', true);

            try {
                const response = await fetch('/api/onboarding', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        ...operatorHeaders(),
                    },
                    body: JSON.stringify({
                        carrierName: document.getElementById('i-carrier').value.trim(),
                        billingEmail: document.getElementById('i-email').value.trim(),
                        paymentTerms: document.getElementById('i-terms').value,
                        taxReference: document.getElementById('i-tax-ref').value.trim(),
                    }),
                });

                const payload = await safeParseResponse(response);
                if (!response.ok || payload.ok === false) {
                    throw new Error(payload?.error?.message || payload?.raw || `Request failed (HTTP ${response.status})`);
                }

                setStatus(`Request recorded. Reference ID: ${payload.id}`, true);
            } catch (error) {
                setStatus(`Submission failed: ${error.message}`, false);
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Submit Intake Request';
            }
        });
    </script>
</body>
</html>
