<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EH Graced Roads - Business Dashboard</title>
    <style>
        :root {
            --bg-dark: #070D09;
            --card-bg: #0B1528;
            --border-color: #1E293B;
            --text-main: #F1F5F9;
            --accent-blue: #38BDF8;
            --accent-orange: #FF9F1C;
            --accent-green: #10B981;
            --accent-red: #EF4444;
            --accent-purple: #A855F7;
            --gate-btn-bg: #1E293B;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 24px;
            margin: 0;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .hub-container {
            max-width: 1750px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .header-title {
            color: var(--accent-green);
            margin: 0 0 10px 0;
            font-size: 1.8rem;
        }

        .cb-dispatch-card {
            border: 2px solid var(--accent-green);
            padding: 20px;
            background: var(--card-bg);
            border-radius: 8px;
            color: #fff;
        }

        .btn-group {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
        }

        .btn-ptt {
            background: var(--accent-red);
            color: white;
            border: none;
            padding: 12px 24px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
        }

        .btn-dispatch {
            background: var(--accent-blue);
            color: white;
            border: none;
            padding: 12px 20px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
        }

        .log-box {
            background: #000;
            padding: 12px;
            border-radius: 5px;
            border-left: 4px solid var(--accent-green);
        }

        .log-text {
            margin: 0;
            font-family: monospace;
            color: var(--accent-green);
        }
    </style>
</head>
<body>

    <div class="hub-container">
        <h1 class="header-title">EH Graced Roads Solutions - Operations Cockpit</h1>

        <!-- CB RADIO & GRACE VOICE DISPATCH CONSOLE -->
        <div class="cb-dispatch-card">
            <h3 style="color: var(--accent-green); margin-top: 0;">📻 CB Radio CH-19 & GRACE Voice Controller</h3>
            
            <div class="btn-group">
                <button id="ptt-btn" class="btn-ptt">
                    🎙️ HOLD TO TALK TO GRACE (PTT)
                </button>
                <button id="dispatch-unit-btn" class="btn-dispatch">
                    🚛 DISPATCH SERVICE UNIT
                </button>
            </div>

            <div class="log-box">
                <p class="log-text" id="grace-status-log">
                    [CH-19 STANDBY] GRACE Listening... Press "Hold to Talk" for roadside customer intake or manual dispatch.
                </p>
            </div>
        </div>
    </div>

    <script>
        const pttBtn = document.getElementById('ptt-btn');
        const dispatchBtn = document.getElementById('dispatch-unit-btn');
        const graceLog = document.getElementById('grace-status-log');

        // Speech Synthesis for GRACE Voice Response
        function speakGrace(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.rate = 1.0;
                utterance.pitch = 1.1;
                
                const voices = window.speechSynthesis.getVoices();
                const graceVoice = voices.find(v => v.name.includes('Female') || v.name.includes('Google US English') || v.name.includes('Zira'));
                if (graceVoice) {
                    utterance.voice = graceVoice;
                }

                window.speechSynthesis.speak(utterance);
            }
        }

        // Push-To-Talk (PTT) Press
        pttBtn.addEventListener('mousedown', () => {
            pttBtn.style.background = '#43a047';
            graceLog.innerText = "[CHANNEL ACTIVE] Transmitting to GRACE... Speak driver status or customer details.";
            speakGrace("GRACE channel open. Go ahead with customer details.");
        });

        // Push-To-Talk (PTT) Release
        pttBtn.addEventListener('mouseup', () => {
            pttBtn.style.background = '#e53935';
            graceLog.innerText = "[PROCESSING] GRACE analyzing voice transcript and persisting customer intake record...";
            
            fetch('/api/radio/dispatch', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    channel: 'CH-19',
                    operator: 'Elijah Wright',
                    mode: 'GRACE Voice On-Site Assist',
                    serviceNotes: 'Roadside assist initiated via CB radio voice request.'
                })
            })
            .then(res => res.json())
            .then(data => {
                const shortId = data.dispatchId.split('-')[1];
                graceLog.innerText = `[SUCCESS] GRACE Intake Complete! Dispatch ID: ${data.dispatchId}`;
                speakGrace(`Customer intake complete. Dispatch ID registered as ${shortId}. You are clear to begin service.`);
            })
            .catch(err => {
                graceLog.innerText = `[ERROR] Failed to contact GRACE backend server.`;
                speakGrace("System alert. Connection to dispatch server failed.");
            });
        });

        // Manual Dispatch Action
        dispatchBtn.addEventListener('click', () => {
            const notes = prompt("Enter service dispatch details (e.g. Unit #, location, issue):");
            if (notes) {
                graceLog.innerText = "[PROCESSING] Dispatching service unit...";
                speakGrace("Processing service unit dispatch request.");

                fetch('/api/radio/dispatch', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        channel: 'DISPATCH-DIRECT',
                        operator: 'Elijah Wright',
                        mode: 'Direct Intake',
                        serviceNotes: notes
                    })
                })
                .then(res => res.json())
                .then(data => {
                    const shortId = data.dispatchId.split('-')[1];
                    graceLog.innerText = `[DISPATCHED] Unit queued successfully! Dispatch ID: ${data.dispatchId}`;
                    speakGrace(`Service unit queued and dispatched. Record locked under ID ${shortId}.`);
                });
            }
        });
    </script>
</body>
</html>
