<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grace Backup Breakdown Scanner</title>
  <style>
    body { background:#020617; color:#e2e8f0; font-family:Arial,sans-serif; margin:0; padding:20px; }
    .container { max-width:1000px; margin:0 auto; }
    .card { background:#0f172a; border:1px solid #334155; border-radius:10px; padding:16px; margin-bottom:12px; }
    .row { display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; }
    .item { margin-top:8px; padding:10px; background:#020617; border:1px solid #1e293b; border-radius:8px; }
    .muted { color:#94a3b8; font-size:12px; }
  </style>
</head>
<body>
<div class="container">
  <div class="card">
    <h2>Backup Breakdown Scanner</h2>
    <div>Server-side Haversine filtering only. Operational watch filter: 150 miles.</div>
    <div class="muted" id="watchMeta">Loading watch-center state...</div>
  </div>
  <div id="list"></div>
</div>
<script>
async function refresh() {
  try {
    const [watchRes, scannerRes] = await Promise.all([
      fetch('/api/watch-center'),
      fetch('/api/breakdowns/scanner')
    ]);
    const watch = await watchRes.json();
    const scanner = await scannerRes.json();

    document.getElementById('watchMeta').textContent = `Watch Center: ${watch.sourceMode === 'live_gps' ? 'Live GPS' : 'Lehigh Valley fallback'} | radius: ${watch.radiusMiles} miles | freshness: ${watch.freshness} | last update: ${watch.lastUpdate || 'none'}`;

    const list = document.getElementById('list');
    list.innerHTML = '';

    if (!scanner.breakdowns || scanner.breakdowns.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'card';
      empty.textContent = 'No active breakdowns within server-side watch filter.';
      list.appendChild(empty);
      return;
    }

    scanner.breakdowns.forEach((b) => {
      const card = document.createElement('div');
      card.className = 'card';

      const row = document.createElement('div');
      row.className = 'row';
      const strong = document.createElement('strong');
      strong.textContent = `${b.id} • ${b.vehicle}`;
      const distance = document.createElement('span');
      distance.textContent = b.distance;
      row.appendChild(strong);
      row.appendChild(distance);

      const item = document.createElement('div');
      item.className = 'item';
      item.textContent = `${b.issue} @ ${b.location} • severity: ${b.severity}`;

      card.appendChild(row);
      card.appendChild(item);
      list.appendChild(card);
    });
  } catch (error) {
    document.getElementById('watchMeta').textContent = 'Watch-center lookup failed. Retrying...';
    const list = document.getElementById('list');
    list.innerHTML = '';
    const offline = document.createElement('div');
    offline.className = 'card';
    offline.textContent = `Scanner temporarily offline: ${error.message}`;
    list.appendChild(offline);
  }
}

refresh();
setInterval(() => {
  refresh().catch((error) => {
    document.getElementById('watchMeta').textContent = 'Watch-center lookup failed. Retrying...';
    const list = document.getElementById('list');
    list.innerHTML = '';
    const offline = document.createElement('div');
    offline.className = 'card';
    offline.textContent = `Scanner temporarily offline: ${error.message}`;
    list.appendChild(offline);
  });
}, 30000);
</script>
</body>
</html>
