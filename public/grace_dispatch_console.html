<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grace Backup Dispatch Console</title>
  <style>
    body { background:#020617; color:#e2e8f0; font-family:Arial,sans-serif; margin:0; padding:20px; }
    .container { max-width:1000px; margin:0 auto; }
    .card { background:#0f172a; border:1px solid #334155; border-radius:10px; padding:16px; margin-bottom:16px; }
    .chips { display:flex; gap:8px; flex-wrap:wrap; margin:8px 0; }
    .chip { border:1px solid; border-radius:999px; padding:5px 10px; font-size:11px; text-transform:uppercase; font-weight:700; }
    .ready { border-color:#10b981; color:#86efac; }
    .active { border-color:#3b82f6; color:#93c5fd; }
    .blocked { border-color:#ef4444; color:#fca5a5; }
    .complete { border-color:#fb923c; color:#fdba74; }
    button { border:none; border-radius:8px; padding:10px 12px; font-weight:700; cursor:pointer; margin-right:8px; margin-bottom:8px; }
    .primary { background:#3b82f6; color:white; }
    .accent { background:#10b981; color:#03140d; }
    .muted { background:#334155; color:white; }
    #log { white-space:pre-wrap; font-family:monospace; background:#020617; border:1px solid #334155; border-radius:8px; padding:12px; min-height:90px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h2>Grace Backup Dispatch Console</h2>
      <div>Backup mode mirrors the same guarded workflow as the main operating dashboard.</div>
      <div class="chips">
        <span class="chip ready">Ready</span>
        <span class="chip active">Active</span>
        <span class="chip blocked">Blocked</span>
        <span class="chip complete">Complete</span>
      </div>
      <div><strong>Guardrails:</strong> Heavy-duty mobile diesel repair only. No towing. No winching. No recovery.</div>
    </div>

    <div class="card">
      <div id="status">Call status: waiting</div>
      <button id="start" class="accent">Start Backup Demo Call</button>
      <button id="next" class="primary">Run Next Stage</button>
      <button id="refresh" class="muted">Refresh</button>
    </div>

    <div class="card">
      <div id="log">Backup console online.</div>
    </div>
  </div>

<script>
let activeCallId = null;
const statusEl = document.getElementById('status');
const logEl = document.getElementById('log');

async function post(path, body) {
  const res = await fetch(path, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body) });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || data.message || 'Request failed');
  return data;
}

async function getCall() {
  if (!activeCallId) return null;
  const res = await fetch(`/api/grace/call/${encodeURIComponent(activeCallId)}`);
  if (!res.ok) return null;
  return res.json();
}

function showCall(call) {
  if (!call) {
    statusEl.textContent = 'Call status: waiting';
    return;
  }
  statusEl.textContent = `Call ${call.callId} | lifecycle=${call.lifecycleState} | dispatch=${call.dispatchStatus}`;
}

async function runNext() {
  try {
    const call = await getCall();
    if (!call) {
      const answered = await post('/api/grace/call/answer', { fleetName:'Backup Fleet', callbackNumber:'+1 610-555-0100' });
      activeCallId = answered.callId;
      showCall(answered);
      logEl.textContent = 'Answered backup call.';
      return;
    }

    if (!call.lifecycleProgress.intakeAt) {
      const data = await post('/api/grace/call/intake', { callId:call.callId, location:'Lehigh Valley, PA', unitNumber:'BKP-101', issue:'No crank', vehicleType:'tractor-trailer', serviceType:'mobile diesel repair' });
      showCall(data); logEl.textContent = 'Intake captured.'; return;
    }
    if (!call.lifecycleProgress.scopeVerifiedAt || call.lifecycleState === 'scope_blocked') {
      const data = await post('/api/grace/call/scope-check', { callId:call.callId, vehicleType:'tractor-trailer', serviceType:'mobile diesel repair', issue:'No crank' });
      showCall(data); logEl.textContent = 'Scope checked.'; return;
    }
    if (!call.lifecycleProgress.quoteReadyAt) {
      const data = await post('/api/grace/call/quote', { callId:call.callId, laborTier:'standard', laborHours:2, travelMiles:25 });
      showCall(data); logEl.textContent = 'Estimate created.'; return;
    }
    if (!call.lifecycleProgress.paymentLinkSentAt) {
      const data = await post('/api/grace/call/payment-link', { callId:call.callId, sendTo:'backup@fleet.example' });
      showCall(data); logEl.textContent = 'Payment link sent.'; return;
    }
    if (!call.lifecycleProgress.technicianOfferedAt) {
      const data = await post('/api/grace/call/technician-offer', { callId:call.callId, technicianId:'backup-tech-1', technicianName:'Backup Tech', etaMinutes:30 });
      showCall(data); logEl.textContent = 'Technician offered.'; return;
    }
    if (!call.lifecycleProgress.technicianAcceptedAt) {
      const data = await post('/api/grace/call/technician-acceptance', { callId:call.callId, technicianAccepted:true });
      showCall(data); logEl.textContent = 'Technician accepted.'; return;
    }
    if (!call.lifecycleProgress.workOrderCreatedAt) {
      const data = await post('/api/grace/call/work-order-create', { callId:call.callId, notes:'Backup dispatch confirmed' });
      showCall(data); logEl.textContent = 'Work order created.'; return;
    }
    if (!call.lifecycleProgress.closeoutCompleteAt) {
      const data = await post('/api/grace/call/closeout', { callId:call.callId, resolution:'Backup flow complete' });
      showCall(data); logEl.textContent = 'Closeout complete.'; return;
    }
    logEl.textContent = 'Backup workflow already complete.';
  } catch (err) {
    logEl.textContent = `Error: ${err.message}`;
  }
}

document.getElementById('start').addEventListener('click', async () => {
  try {
    const data = await post('/api/grace/call/answer', { fleetName:'Backup Fleet', callbackNumber:'+1 610-555-0100' });
    activeCallId = data.callId;
    showCall(data);
    logEl.textContent = 'Started backup demo call.';
  } catch (err) { logEl.textContent = `Error: ${err.message}`; }
});

document.getElementById('next').addEventListener('click', runNext);
document.getElementById('refresh').addEventListener('click', async () => showCall(await getCall()));
</script>
</body>
</html>
