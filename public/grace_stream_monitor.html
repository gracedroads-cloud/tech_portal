<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grace Backup Stream Monitor</title>
  <style>
    body { background:#020617; color:#e2e8f0; font-family:Arial,sans-serif; margin:0; padding:20px; }
    .container { max-width:1000px; margin:0 auto; }
    .card { background:#0f172a; border:1px solid #334155; border-radius:10px; padding:16px; margin-bottom:12px; }
    #log { white-space:pre-wrap; font-family:monospace; background:#020617; border:1px solid #1e293b; border-radius:8px; padding:12px; min-height:120px; }
    button { border:none; border-radius:8px; padding:10px 12px; margin-right:8px; font-weight:700; cursor:pointer; }
    .pickup { background:#00E676; color:#021a10; }
    .resume { background:#334155; color:#fff; }
  </style>
</head>
<body>
<div class="container">
  <div class="card">
    <h2>Grace Backup Stream Monitor</h2>
    <div>Compatibility monitor for call-control status only (no real phone operations).</div>
    <div id="status">Loading call-control mode...</div>
    <div style="margin-top:12px;">
      <button id="pickup" class="pickup">Pickup Override</button>
      <button id="resume" class="resume">Return to Grace AI</button>
    </div>
  </div>
  <div class="card">
    <div id="log">Backup stream monitor online.</div>
  </div>
</div>
<script>
const statusEl = document.getElementById('status');
const logEl = document.getElementById('log');

async function refresh() {
  try {
    const statusRes = await fetch('/api/status');
    const status = await statusRes.json();
    const callsRes = await fetch('/api/grace/calls');
    const calls = await callsRes.json();
    statusEl.textContent = `Call-control: ${status.callControl.mode} | base: ${status.base} | tracked calls: ${calls.totalCalls}`;
  } catch (error) {
    statusEl.textContent = 'Call-control monitor offline. Retrying...';
    logEl.textContent = `Error: ${error.message}`;
  }
}

async function override(action) {
  const res = await fetch('/api/stream/override', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({ action })
  });
  const data = await res.json();
  if (!res.ok) {
    logEl.textContent = `Error: ${data.error || 'override failed'}`;
    return;
  }
  logEl.textContent = `${new Date().toISOString()}\n${data.message}\nmode=${data.callControl.mode}`;
  await refresh();
}

document.getElementById('pickup').addEventListener('click', () => override('pickup'));
document.getElementById('resume').addEventListener('click', () => override('resume_grace'));

refresh();
setInterval(() => {
  refresh().catch((error) => {
    statusEl.textContent = 'Call-control monitor offline. Retrying...';
    logEl.textContent = `Error: ${error.message}`;
  });
}, 15000);
</script>
</body>
</html>
