<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grace Stream Monitor</title>
  <style>
    body { background: #020617; color: #f1f5f9; font-family: monospace; margin: 0; padding: 20px; }
    .panel { max-width: 900px; margin: 0 auto; background: #0f172a; border: 1px solid #334155; border-radius: 12px; padding: 16px; }
    input, button { background: #020617; color: #f1f5f9; border: 1px solid #334155; border-radius: 8px; padding: 8px; }
    button { cursor: pointer; }
    pre { background: #020617; border: 1px solid #1e293b; border-radius: 8px; padding: 10px; min-height: 240px; }
  </style>
</head>
<body>
  <div class="panel">
    <h2>Grace Call Flow State Monitor</h2>
    <p>Use this to inspect audit-friendly state transitions and approval gates.</p>
    <input id="callId" placeholder="Enter callId from dispatch console" style="width:65%;">
    <button onclick="loadState()">Load Call State</button>
    <pre id="stateOutput">No call loaded.</pre>
  </div>

  <script>
    async function loadState() {
      const callId = document.getElementById('callId').value.trim();
      if (!callId) return;
      const response = await fetch(`/api/grace/calls/${encodeURIComponent(callId)}`);
      const json = await response.json();
      document.getElementById('stateOutput').textContent = JSON.stringify({ status: response.status, ...json }, null, 2);
    }
  </script>
</body>
</html>
