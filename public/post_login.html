<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Grace Post-Login Check</title><style>body{margin:0;background:#061321;color:#eaf5ff;font:16px Arial}main{max-width:850px;margin:auto;padding:30px}h1{color:#58c7ff}.card{background:#0d2235;border:1px solid #315a78;border-radius:10px;padding:18px;margin:14px 0}.step{display:flex;gap:12px}.step input{margin-top:5px;transform:scale(1.3)}button{background:#3fd39a;border:0;border-radius:6px;padding:12px 18px;font-weight:bold;cursor:pointer}#result{color:#a8d8ef}</style></head><body><main><h1>Grace System Post-Login Check</h1><p>Complete this checklist after every Windows Hello sign-in before beginning dispatch operations.</p><div class="card"><strong id="health">Checking console health…</strong><p id="result">The system is verifying the local console.</p></div><div class="card step"><input type="checkbox" id="one"><label for="one"><strong>1. Confirm System Online</strong><br>Verify the health check above reports healthy.</label></div><div class="card step"><input type="checkbox" id="two"><label for="two"><strong>2. Confirm Operations Wall live connection</strong><br>Open the wall and confirm <em>System Online</em> and <em>SSE Connected</em>.</label></div><div class="card step"><input type="checkbox" id="three"><label for="three"><strong>3. Confirm location and radius</strong><br>Select Use Current Location, confirm the base is correct, and confirm the normal 150-mile radius.</label></div><div class="card step"><input type="checkbox" id="four"><label for="four"><strong>4. Review urgent events</strong><br>Check priority-one breakdowns, location alerts, and traffic-provider status. Traffic unavailable does not mean roads are clear.</label></div><div class="card step"><input type="checkbox" id="five"><label for="five"><strong>5. Confirm service policy</strong><br>Grace does not provide towing, winching, or vehicle-recovery services. Do not accept those requests.</label></div><p><button id="open" disabled>Open Authorized Operations Wall</button></p></main><script>(()=>{const p=new URLSearchParams(location.search),k=p.get('operationsKey'),a=p.get('apiKey');if(k)sessionStorage.setItem('graceOperationsAccessKey',k);if(a)sessionStorage.setItem('graceApiKey',a);if(k||a)history.replaceState({},document.title,location.pathname);fetch('/healthz').then(r=>r.json()).then(x=>{document.getElementById('health').textContent=x.status==='ok'?'Console health: HEALTHY':'Console health: CHECK REQUIRED';document.getElementById('result').textContent=x.status==='ok'?'Continue the five operator checks below.':'Do not dispatch until the console is healthy.'}).catch(()=>{document.getElementById('health').textContent='Console health: UNAVAILABLE';document.getElementById('result').textContent='Run Launch_Graced_Roads_Cockpit.bat and try again.'});const boxes=[...document.querySelectorAll('input')],b=document.getElementById('open');boxes.forEach(x=>x.onchange=()=>b.disabled=!boxes.every(y=>y.checked));b.onclick=()=>location.href='/operations.html'})()</script></body></html>
